name: Citation strategy bench

# Live comparison of line-citation strategies against the decisions API (bench/citation-strategies.ts).
# Reads the DECISION_MODEL_LINTER_OPENROUTER_API_KEY secret, as getsentry/sentry and getsentry/seer do; results land in the job summary.
on:
  pull_request:
    paths: ['bench/**', 'test/citation-bench.test.ts', '.github/workflows/citation-bench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Compare citation strategies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: node bench/citation-strategies.ts --dry --only two-pass,combined --output citation-dry.json

      - name: Compare detection and citation end to end
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo 'Set the DECISION_MODEL_LINTER_OPENROUTER_API_KEY repository secret to run the live comparison.' | tee citation-results.txt
            exit 1
          fi
          node bench/citation-strategies.ts --only two-pass,combined --repeats 5 --output citation-results.json | tee citation-results.txt
        env:
          OPENROUTER_API_KEY: ${{ secrets.DECISION_MODEL_LINTER_OPENROUTER_API_KEY }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: citation-strategies
          path: |
            citation-*.json
            citation-*.txt
