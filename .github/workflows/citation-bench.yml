name: Citation strategy bench

# Live comparison of line-citation strategies against the decisions API (bench/citation-strategies.ts).
# Reads the DECISION_MODEL_LINTER_OPENROUTER_API_KEY secret, as getsentry/sentry and getsentry/seer do; results land in the job summary.
on:
  pull_request:
    paths: ['bench/**', '.github/workflows/citation-bench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Compare citation strategies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: node bench/citation-strategies.ts --dry

      - run: node bench/citation-strategies.ts --repeats 3
        env:
          OPENROUTER_API_KEY: ${{ secrets.DECISION_MODEL_LINTER_OPENROUTER_API_KEY }}
