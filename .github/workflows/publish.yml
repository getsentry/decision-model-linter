name: Publish

# Publishes the package to GitHub Packages when a version tag (v1.2.3) is pushed. A prerelease
# version (1.2.3-rc.1) is published under the `next` dist-tag.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@getsentry'

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$version" == *-* ]]; then npm publish --tag next; else npm publish; fi
